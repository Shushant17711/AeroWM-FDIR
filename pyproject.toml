[project]
name = "aerowm-fdir"
version = "1.0.0"
description = "Latent world model & MPPI control for 6-DOF rocket powered descent with real-time fault detection, isolation and recovery (research software)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Shushant" }]
keywords = [
    "fault-detection-and-isolation",
    "world-models",
    "model-predictive-control",
    "reinforcement-learning",
    "aerospace",
    "powered-descent",
    "research",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.6",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Shushant17711/AeroWM-FDIR"
Repository = "https://github.com/Shushant17711/AeroWM-FDIR"
Issues = "https://github.com/Shushant17711/AeroWM-FDIR/issues"
Changelog = "https://github.com/Shushant17711/AeroWM-FDIR/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["configs*", "envs*", "models*", "agents*", "train*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: requires a CUDA device",
    "slow: long-running performance test",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The repository is linted for real errors (unused imports, undefined
# names, syntax errors).  Style rules (import order, line length) are not
# enforced: the code was written before the tooling was configured and a
# reformat would obscure the measurement history in the diff.
select = ["E9", "F"]
ignore = ["E501"]
